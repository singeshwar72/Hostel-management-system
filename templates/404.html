<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Poppins',sans-serif; }
        body{ background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; padding: 20px; }
        .error-card{ background: #1e293b; padding: 40px; border-radius: 16px; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .error-card h1{ font-size: 4rem; color: #38bdf8; margin-bottom: 10px; }
        .error-card h2{ font-size: 1.3rem; margin-bottom: 15px; font-weight: 500; }
        .error-card p{ color: #94a3b8; font-size: 0.9rem; margin-bottom: 25px; }
        .btn{ display: inline-block; padding: 12px 24px; background: #0284c7; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 0.9rem; }
        .btn:hover{ background: #0369a1; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page or endpoint you are looking for does not exist or has been moved.</p>
        <a href="http://127.0.0.1:5001" class="btn"><i class="fa-solid fa-house"></i> Back to Student Portal</a>
    </div>
</body>
</html>
