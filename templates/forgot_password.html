<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password - Student Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        *{ margin:0; padding:0; box-sizing:border-box; font-family:'Plus Jakarta Sans',sans-serif; }
        
        html, body {
            height: 100vh; width: 100vw;
            background: #030712;
            display: grid; place-items: center;
            overflow: hidden; color: #f8fafc;
        }

        #bgCanvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 0; pointer-events: none;
        }

        .glass-card-wrapper {
            position: relative; z-index: 1; width: 100%; max-width: 440px; padding: 3px;
            border-radius: 28px; background: linear-gradient(135deg, rgba(2,132,199,0.6), rgba(124,58,237,0.6), rgba(16,185,129,0.6));
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(2, 132, 199, 0.2);
        }

        .login-card {
            background: rgba(11, 15, 25, 0.90);
            border-radius: 26px; padding: 40px;
            backdrop-filter: blur(30px);
            position: relative; overflow: hidden;
        }

        .login-card::before {
            content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
            width: 150px; height: 3px; background: linear-gradient(90deg, transparent, #0284c7, #7c3aed, transparent);
        }

        .brand-header {
            display: flex; align-items: center; gap: 14px; margin-bottom: 22px;
        }
        .brand-icon {
            width: 52px; height: 52px; background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
            border-radius: 16px; display: grid; place-items: center;
            font-size: 1.4rem; color: white;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
        }
        .brand-text h2 { font-size: 1.5rem; font-weight: 700; color: white; letter-spacing: -0.5px; }
        .brand-text p { font-size: 0.82rem; color: #94a3b8; }

        .field-group { margin-bottom: 15px; }
        .field-group label {
            display: block; font-size: 0.73rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px;
            color: #94a3b8; margin-bottom: 6px;
        }

        .input-wrap { position: relative; }
        .input-wrap i {
            position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
            color: #64748b; font-size: 0.9rem; transition: 0.3s;
        }

        .form-input {
            width: 100%; padding: 12px 14px 12px 42px;
            background: rgba(15, 23, 42, 0.7);
            border: 1.5px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px; color: white; font-size: 0.9rem;
            outline: none; transition: all 0.3s ease;
        }
        .form-input::placeholder { color: #475569; }
        .form-input:focus {
            border-color: #0284c7; background: rgba(15, 23, 42, 0.95);
            box-shadow: 0 0 0 4px rgba(2, 132, 199, 0.2);
        }
        .form-input:focus ~ i { color: #0284c7; }

        .submit-btn {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #0284c7 0%, #7c3aed 100%);
            color: white; border: none; border-radius: 14px;
            font-weight: 700; font-size: 0.95rem; cursor: pointer;
            box-shadow: 0 10px 25px rgba(2, 132, 199, 0.4);
            transition: all 0.3s ease; margin-top: 5px;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .submit-btn:hover { transform: translateY(-2px); filter: brightness(1.15); }

        .alert-error {
            background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171; padding: 10px 14px; border-radius: 10px; font-size: 0.82rem; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }
        .alert-success {
            background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399; padding: 10px 14px; border-radius: 10px; font-size: 0.82rem; margin-bottom: 16px;
            display: flex; align-items: center; gap: 8px;
        }

        .card-footer {
            margin-top: 20px; text-align: center; font-size: 0.8rem; color: #94a3b8;
        }
        .card-footer a { color: #38bdf8; text-decoration: none; font-weight: 600; }
        .card-footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <canvas id="bgCanvas"></canvas>

    <div class="glass-card-wrapper">
        <div class="login-card">
            <div class="brand-header">
                <div class="brand-icon"><i class="fa-solid fa-key"></i></div>
                <div class="brand-text">
                    <h2>Reset Password</h2>
                    <p>Update your portal credentials</p>
                </div>
            </div>

            {% if error %}
                <div class="alert-error"><i class="fa-solid fa-triangle-exclamation"></i> {{ error }}</div>
            {% endif %}
            {% if message %}
                <div class="alert-success"><i class="fa-solid fa-circle-check"></i> {{ message }}</div>
            {% endif %}

            <form method="POST">
                <div class="field-group">
                    <label>Student ID</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-id-card"></i>
                        <input type="text" name="user_id" class="form-input" placeholder="e.g. BCE/2026/042" required autocomplete="off">
                    </div>
                </div>

                <div class="field-group">
                    <label>New Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="new_password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <div class="field-group">
                    <label>Confirm New Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" name="confirm_password" class="form-input" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    <span>Update Password</span>
                    <i class="fa-solid fa-arrow-right-long"></i>
                </button>
            </form>

            <div class="card-footer">
                Remember your password? <a href="{{ url_for('student_login') }}">Sign In</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let mouse = { x: canvas.width / 2, y: canvas.height / 2 };
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Node {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.color = Math.random() > 0.5 ? '#0284c7' : '#7c3aed';
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fill();
            }
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                if (distance < 120) {
                    let force = (120 - distance) / 120;
                    this.x -= (dx / distance) * force * 4;
                    this.y -= (dy / distance) * force * 4;
                } else {
                    if (this.x !== this.baseX) this.x -= (this.x - this.baseX) / 20;
                    if (this.y !== this.baseY) this.y -= (this.y - this.baseY) / 20;
                }
            }
        }

        let nodes = [];
        for (let i = 0; i < 60; i++) nodes.push(new Node());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let gradient = ctx.createRadialGradient(mouse.x, mouse.y, 0, mouse.x, mouse.y, 350);
            gradient.addColorStop(0, 'rgba(2, 132, 199, 0.15)');
            gradient.addColorStop(1, 'transparent');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            for (let node of nodes) {
                node.update();
                node.draw();
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
