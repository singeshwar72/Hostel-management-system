{% extends 'public_base_v2.html' %}{% block title %}Student Sign In | BCE Hostel{% endblock %}{% block content %}<div class="auth-wrap"><section class="card auth-card"><h1>Student sign in</h1><p class="subtitle">Access your room, notices, fees, and hostel services.</p>{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="POST"><div class="field"><label>Student ID</label><input name="user_id" required autofocus></div><div class="field"><label>Password</label><input name="password" type="password" required></div><button type="submit"><i class="fa-solid fa-right-to-bracket"></i> Sign in</button></form><p class="links"><a href="{{ url_for('register_student') }}">Create a student account</a> · <a href="{{ url_for('forgot_password') }}">Forgot password?</a></p></section></div>{% endblock %}
