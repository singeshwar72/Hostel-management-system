{% extends 'base.html' %}

{% block content %}


<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">


<style>


.student-register-wrapper{


display:flex;

justify-content:center;

align-items:center;

padding:20px;


}



.student-register-card{


width:650px;


background:var(--card);


padding:35px;


border-radius:25px;


box-shadow:

0 15px 40px rgba(0,0,0,.1);


animation:show .5s;


}




@keyframes show{


from{

opacity:0;

transform:translateY(30px);

}


to{

opacity:1;

transform:translateY(0);

}


}





.student-header{


text-align:center;

margin-bottom:30px;


}




.student-icon{


height:85px;

width:85px;


margin:auto;


display:flex;

align-items:center;

justify-content:center;


border-radius:50%;


background:

linear-gradient(135deg,#2563eb,#60a5fa);


color:white;


font-size:38px;


}




.student-header h2{


margin-top:18px;


font-size:28px;


color:var(--text);


}



.student-header p{


color:var(--muted);


font-size:14px;


}





.form-grid{


display:grid;


grid-template-columns:

repeat(2,1fr);


gap:20px;


}



.form-group{


display:flex;


flex-direction:column;


}



.form-group.full{


grid-column:1/-1;


}




label{


font-weight:600;


color:var(--text);


margin-bottom:8px;


}




.input-box{


position:relative;


}




.input-box i{


position:absolute;


left:15px;


top:50%;


transform:translateY(-50%);


color:#2563eb;


}




input,select{


width:100%;


padding:14px 15px 14px 45px;


border-radius:12px;


border:2px solid #e2e8f0;


outline:none;


font-size:15px;


transition:.3s;


background:white;


}



input:focus,select:focus{


border-color:#2563eb;


box-shadow:

0 0 10px rgba(37,99,235,.15);


}





.phone-box{


display:flex;


gap:10px;


}



.country-code{


padding:14px;


background:#e2e8f0;


border-radius:12px;


font-weight:700;


color:#334155;


}





.phone-box .input-box{


flex:1;


}






.register-btn{


width:100%;


margin-top:30px;


padding:16px;


border:none;


border-radius:15px;


background:

linear-gradient(135deg,#16a34a,#22c55e);


color:white;


font-size:17px;


font-weight:600;


cursor:pointer;


transition:.3s;


}



.register-btn:hover{


transform:translateY(-4px);


box-shadow:

0 15px 30px rgba(34,197,94,.3);


}






.alert{


padding:15px;


margin-top:20px;


border-radius:12px;


font-weight:600;


}



.success{


background:#dcfce7;


color:#166534;


border-left:5px solid #22c55e;


}




.error{


background:#fee2e2;


color:#991b1b;


border-left:5px solid #ef4444;


}





@media(max-width:700px){


.form-grid{


grid-template-columns:1fr;


}


}



</style>







<div class="student-register-wrapper">


<div class="student-register-card">






<div class="student-header">


<div class="student-icon">


<i class="fa-solid fa-user-graduate"></i>


</div>


<h2>

Student Registration

</h2>


<p>

Register student details for hostel allocation

</p>


</div>









<form method="POST">






<div class="form-grid">






<div class="form-group full">


<label>

Full Name

</label>


<div class="input-box">


<i class="fa-solid fa-user"></i>


<input

type="text"

name="name"

placeholder="e.g. Rahul Kumar"

required>


</div>


</div>







<div class="form-group full">


<label>

Phone Number

</label>


<div class="phone-box">


<div class="country-code">

+91

</div>


<div class="input-box">


<i class="fa-solid fa-phone"></i>


<input

type="text"

name="phone"

placeholder="9876543210"

pattern="\d{10}"

maxlength="10"

title="Enter exactly 10 digits"

required>


</div>


</div>


</div>









<div class="form-group">


<label>

Branch

</label>


<div class="input-box">


<i class="fa-solid fa-code"></i>


<input

type="text"

name="branch"

placeholder="Computer Science & Engineering"

required>


</div>


</div>









<div class="form-group">


<label>

Year

</label>


<div class="input-box">


<i class="fa-solid fa-calendar"></i>


<input

type="number"

name="year"

min="1"

max="4"

placeholder="1 - 4"

required>


</div>


</div>









<div class="form-group full">


<label>

Gender

</label>


<div class="input-box">


<i class="fa-solid fa-venus-mars"></i>


<select name="gender" required>


<option value="">Select Gender</option>

<option>

Male

</option>


<option>

Female

</option>


</select>


</div>


</div>






</div>








<button class="register-btn" type="submit">


<i class="fa-solid fa-user-plus"></i>


Register Student


</button>






</form>








{% if message %}


<div class="alert success">


<i class="fa-solid fa-circle-check"></i>


{{ message }}


</div>


{% endif %}







{% if error %}


<div class="alert error">


<i class="fa-solid fa-circle-exclamation"></i>


{{ error }}


</div>


{% endif %}







</div>


</div>





{% endblock %}
