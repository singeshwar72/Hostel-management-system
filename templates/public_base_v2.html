<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="google-site-verification" content="Ytvi7VWUvYxtCvzQ_f0PGhjB2RHTlB1vu4VdLxKxvp8" /><title>{% block title %}BCE Hostel Portal{% endblock %}</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"><style>:root{--primary:#4f46e5;--primary-dark:#4338ca;--text:#0f172a;--muted:#64748b;--line:#e2e8f0;--success:#166534;--danger:#9f1239}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef2ff,#f8fafc 48%,#e0f2fe);color:var(--text);font:14px Inter,Arial,sans-serif}.site-header{max-width:1150px;margin:auto;padding:20px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:10px;font:700 19px Outfit,sans-serif}.brand-mark{width:38px;height:38px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#6366f1,#0284c7);border-radius:11px}.site-nav{display:flex;gap:7px;flex-wrap:wrap}.site-nav a{padding:8px 10px;color:var(--muted);text-decoration:none;font-weight:600;border-radius:8px}.site-nav a:hover{background:#fff;color:var(--primary)}.public-main{width:min(1120px,calc(100% - 40px));margin:28px auto 50px}.card{background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:22px;padding:30px;box-shadow:0 15px 38px rgba(30,41,59,.09)}.auth-wrap{min-height:calc(100vh - 150px);display:grid;place-items:center}.auth-card{width:min(500px,100%)}h1,h2,h3{font-family:Outfit,Inter,sans-serif}h1{font-size:30px;margin:0 0 8px}h2{margin:0 0 14px}.subtitle,.muted{color:var(--muted)}.field{margin-bottom:15px}.field label{display:block;font-weight:600;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;font:inherit}.field textarea{min-height:100px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{outline:3px solid #e0e7ff;border-color:var(--primary)}button,.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:9px;background:var(--primary);color:#fff;padding:11px 15px;font:600 13px Inter,sans-serif;text-decoration:none;cursor:pointer}button:hover,.button:hover{background:var(--primary-dark)}.button.secondary{background:#475569}.alert{padding:12px 14px;border-radius:10px;margin:16px 0}.alert.error{background:#ffe4e6;color:var(--danger)}.alert.success{background:#dcfce7;color:var(--success)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}.feature{padding:20px;border:1px solid var(--line);border-radius:15px;background:#fff}.feature i{font-size:20px;color:var(--primary)}.feature h3{margin:13px 0 7px}.feature p{color:var(--muted);margin:0;line-height:1.6}.links{margin-top:18px;color:var(--muted)}.links a{color:var(--primary);font-weight:600;text-decoration:none}@media(max-width:650px){.site-header{padding:16px 20px;align-items:flex-start;flex-direction:column}.public-main{width:min(100% - 28px,1120px);margin-top:14px}.card{padding:22px}}</style>{% block extra_style %}{% endblock %}</head><body><header class="site-header"><div class="brand"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSy4UFNAqbkI9zrSJ5zNbcts31nRrYhZSFZXvUICF4OrDaFhrL6nUFHX1v6&s=10" alt="Logo" style="width: 50px; height: 50px; object-fit:cover; border-radius:11px;">BCE Hostel Portal</div><nav class="site-nav"><a href="/">Home</a><a href="/about">About</a><a href="/contact">Contact</a></nav></header><main class="public-main">{% block content %}{% endblock %}</main></body></html>
