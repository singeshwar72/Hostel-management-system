{% extends 'public_base_v2.html' %}{% block title %}Reset Password | BCE Hostel{% endblock %}{% block content %}<div class="auth-wrap"><section class="card auth-card"><h1>Reset password</h1><p class="subtitle">Set a new password for your student account.</p>{% if message %}<div class="alert success">{{ message }}</div>{% endif %}{% if error %}<div class="alert error">{{ error }}</div>{% endif %}<form method="POST"><div class="field"><label>Student ID</label><input name="user_id" required></div><div class="field"><label>New password</label><input name="new_password" type="password" required></div><div class="field"><label>Confirm new password</label><input name="confirm_password" type="password" required></div><button type="submit">Reset password</button></form><p class="links"><a href="{{ url_for('student_login') }}">Back to sign in</a></p></section></div>{% endblock %}
